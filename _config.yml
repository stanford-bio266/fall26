# ============================================================
#  SITE SETTINGS — you normally never need to edit this file.
#  (Only url / baseurl, set once when the site is first published.)
# ============================================================
title: "BIO 166/266 · PUBLPOL 166"
description: "Securing against biological threats: natural, accidental, deliberate — Stanford, Fall 2026"

url: "https://stanford-bio266.github.io"
baseurl: "/fall26"

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 4
  preview_words_after: 8
  rel_url: true
  button: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top ↑"

aux_links:
  "Canvas":
    - "https://canvas.stanford.edu/courses/231306"
aux_links_new_tab: true

callouts_level: quiet
callouts:
  due:
    title: Due
    color: red
  important:
    title: Important
    color: yellow
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  ai:
    title: AI policy
    color: purple

footer_content: "BIO 166/266 · PUBLPOL 166 · Stanford University · Fall 2026."

# Class pages: each folder part-1 … part-5 is automatically placed under its Part.
permalink: pretty
defaults:
  - scope: { path: "part-1" }
    values: { layout: class, parent: "Part 1: Introduction", permalink: "/classes/:basename/" }
  - scope: { path: "part-2" }
    values: { layout: class, parent: "Part 2: Containing Pandemics", permalink: "/classes/:basename/" }
  - scope: { path: "part-3" }
    values: { layout: class, parent: "Part 3: New Technologies", permalink: "/classes/:basename/" }
  - scope: { path: "part-4" }
    values: { layout: class, parent: "Part 4: The R&D Ecosystem", permalink: "/classes/:basename/" }
  - scope: { path: "part-5" }
    values: { layout: class, parent: "Part 5: Final Presentations", permalink: "/classes/:basename/" }

exclude:
  - README.md
  - EDITING-GUIDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
